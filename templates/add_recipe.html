<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Add a recipe — KitchenOS</title>
    <meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/kitchenos.css">
    <style>
        :root { --accent: var(--app-kitchenos); }
        * { box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            margin: 0; padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
            background: var(--bg);
            background-image: var(--dots);
            background-size: var(--dot-size) var(--dot-size);
            color: var(--ink);
        }
        .wrap { max-width: 560px; margin: 0 auto; }
        h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 8px; }
        .lead { font-size: 15px; color: var(--muted); margin: 0 0 18px; }
        label { display: block; font-weight: 600; margin: 0 0 6px; }
        input[type=url] { width: 100%; font: inherit; font-size: 16px; color: var(--ink);
                          background: var(--surface); border: 1px solid var(--line);
                          border-radius: 10px; padding: 13px 12px; }
        button { margin-top: 12px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
                 color: var(--text-on-accent); background: var(--accent); border: 0;
                 border-radius: 10px; padding: 13px 20px; min-height: 48px; }
        button[disabled] { opacity: .55; cursor: default; }
        input:focus-visible, button:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px; }
        #status { margin-top: 18px; font-size: 15px; border-radius: 10px; padding: 14px;
                  border: 1px solid var(--line); background: var(--surface); }
        #status[hidden] { display: none; }
        #status.ok { border-color: var(--done); }
        #status.bad { border-color: var(--alert); }
        #status a { color: var(--accent); font-weight: 600; }
        .also { margin-top: 26px; font-size: 13.5px; color: var(--muted); }
        .also a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Add a recipe</h1>
        <p class="lead">Paste a link to a cooking video. KitchenOS reads it and files the recipe in your vault.</p>
        <form id="add">
            <label for="url">Link</label>
            <input id="url" name="url" type="url" inputmode="url" required
                   placeholder="https://www.youtube.com/watch?v=…" autocomplete="off">
            <button id="go" type="submit">Add recipe</button>
        </form>
        <div id="status" role="status" aria-live="polite" hidden></div>
        <p class="also">Several at once? Drop the links in the “Recipies to Process” Reminders list —
            they are picked up every hour. <a href="/recent">See what landed lately</a>.</p>
    </div>
    <script>
    (function () {
        var form = document.getElementById('add');
        var input = document.getElementById('url');
        var button = document.getElementById('go');
        var status = document.getElementById('status');

        function show(kind, nodes) {
            status.hidden = false;
            status.className = kind;
            status.replaceChildren.apply(status, nodes);
        }
        function text(s) { return document.createTextNode(s); }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            var url = input.value.trim();
            if (!url) return;
            button.disabled = true;
            button.textContent = 'Working…';
            show('', [text('Reading the video. This usually takes a minute or two and can take up to five — keep this page open.')]);

            fetch('/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            }).then(function (response) {
                return response.json().catch(function () { return {}; }).then(function (body) {
                    return { ok: response.ok, body: body };
                });
            }).then(function (result) {
                if (result.ok && result.body.status === 'success' && result.body.recipe) {
                    var link = document.createElement('a');
                    link.href = '/recipe/' + encodeURIComponent(result.body.recipe);
                    link.textContent = result.body.recipe;
                    show('ok', [text('✅ Saved: '), link]);
                    input.value = '';
                } else {
                    var why = result.body.message || result.body.error || 'Extraction failed.';
                    show('bad', [text('⛔ That one did not work. ' + why + ' Your link is still in the box.')]);
                }
            }).catch(function () {
                show('bad', [text('⛔ Could not reach KitchenOS. Your link is still in the box — try again.')]);
            }).then(function () {
                button.disabled = false;
                button.textContent = 'Add recipe';
            });
        });
    })();
    </script>
</body>
</html>
