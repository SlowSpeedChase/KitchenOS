<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Print my week — KitchenOS</title>
    <meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/kitchenos.css">
    <script src="/static/print-action.js" defer></script>
    <style>
        :root { --rule: var(--done); }
        * { box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            margin: 0; padding: 20px;
            background: var(--bg); color: var(--ink);
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .wrap { max-width: 900px; margin: 0 auto; }
        .toolbar { text-align: right; margin-bottom: 12px; }
        .toolbar button {
            font: inherit; font-size: 14px; padding: 8px 16px; cursor: pointer;
            border: 1px solid var(--rule); background: var(--bg); color: var(--rule); border-radius: 8px;
        }
        h1 { font-size: 22px; margin: 0 0 2px; }
        h2 { font-size: 16px; margin: 0 0 8px; border-bottom: 2px solid var(--rule); padding-bottom: 4px; }
        .targets { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
        section { margin: 0 0 22px; }
        table.week-grid { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.week-grid th, table.week-grid td {
            border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top;
        }
        table.week-grid th { background: color-mix(in srgb, var(--rule) 14%, var(--surface)); }
        table.week-grid td.day { font-weight: 600; white-space: nowrap; }
        table.week-grid td.macros { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .week-grid a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--rule); }
        .mult { color: var(--muted); }
        .empty { color: var(--muted); }
        .warn { color: var(--warning); }
        .warnings { font-size: 12px; color: var(--warning); background: var(--tint-warning);
                    border: 1px solid var(--edge-warning); border-radius: 6px; padding: 6px 10px; margin: 0 0 16px; }
        ul.checklist { list-style: none; padding: 0; margin: 0; columns: 2; font-size: 14px; }
        ul.checklist li { break-inside: avoid; margin: 3px 0; }
        .checklist .meta { color: var(--muted); font-size: 12px; }
        @media print {
            body { padding: 0; }
            .toolbar, #ko-claude-bar { display: none !important; }
            .pagebreak { break-before: page; }
            section, ul.checklist li, table.week-grid tr { break-inside: avoid; }
            @page { margin: 12mm; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="toolbar"><button type="button" data-print-action>🖨️ Print this week</button></div>
        <!--PACKET-->
    </div>
</body>
</html>
