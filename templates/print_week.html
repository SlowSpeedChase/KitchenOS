<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Print my week — KitchenOS</title>
    <style>
        :root { color-scheme: light dark; --line: #3f9e4d; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px; background: Canvas; color: CanvasText;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .wrap { max-width: 900px; margin: 0 auto; }
        .toolbar { text-align: right; margin-bottom: 12px; }
        .toolbar button {
            font: inherit; font-size: 14px; padding: 8px 16px; cursor: pointer;
            border: 1px solid var(--line); background: Canvas; color: var(--line); border-radius: 8px;
        }
        h1 { font-size: 22px; margin: 0 0 2px; }
        h2 { font-size: 16px; margin: 0 0 8px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
        .targets { margin: 0 0 16px; color: GrayText; font-size: 14px; }
        section { margin: 0 0 22px; }
        table.week-grid { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.week-grid th, table.week-grid td {
            border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top;
        }
        table.week-grid th { background: color-mix(in srgb, var(--line) 14%, Canvas); }
        table.week-grid td.day { font-weight: 600; white-space: nowrap; }
        table.week-grid td.macros { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .week-grid a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--line); }
        .mult { color: GrayText; }
        .empty { color: GrayText; }
        .warn { color: #b8860b; }
        .warnings { font-size: 12px; color: #8a6d00; background: color-mix(in srgb, #ffe082 40%, Canvas);
                    border: 1px solid #ffe082; border-radius: 6px; padding: 6px 10px; margin: 0 0 16px; }
        ul.checklist { list-style: none; padding: 0; margin: 0; columns: 2; font-size: 14px; }
        ul.checklist li { break-inside: avoid; margin: 3px 0; }
        .checklist .meta { color: GrayText; font-size: 12px; }
        @media print {
            body { padding: 0; }
            .toolbar, #ko-claude-bar { display: none !important; }
            .pagebreak { break-before: page; }
            section, ul.checklist li, table.week-grid tr { break-inside: avoid; }
            @page { margin: 12mm; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="toolbar"><button onclick="window.print()">🖨️ Print this week</button></div>
        <!--PACKET-->
    </div>
</body>
</html>
