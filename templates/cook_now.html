<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cook Now — KitchenOS</title>
<meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/kitchenos.css">
<style>
  body { font-family: var(--font-body); background: var(--bg);
         background-image: var(--dots);
         background-size: var(--dot-size) var(--dot-size);
         color: var(--ink);
         margin: 0; padding: 1rem; max-width: 900px; margin-inline: auto; }
  h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
  #cook-now-chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
  .chip { border: 1px solid var(--line); border-radius: 999px;
          padding: .35rem .8rem; font-size: .9rem; cursor: pointer;
          background: var(--surface); color: var(--muted); }
  .chip[aria-pressed="true"] { color: var(--app-kitchenos);
          border-color: var(--app-kitchenos); font-weight: 600; }
  #hidden-note { font-size: .85rem; opacity: .7; margin: 0 0 1rem; }
  /* The whole row is the link to the recipe — on a phone a tappable name alone
     is a small target, and the coverage/missing text is part of "what is this". */
  .recipe { display: block; padding: .7rem 0; min-height: 44px;
            border-bottom: 1px solid var(--line);
            color: inherit; text-decoration: none; }
  .recipe:active { opacity: .6; }
  .recipe-head { display: flex; justify-content: space-between; gap: 1rem;
                 align-items: baseline; }
  .name { font-weight: 600; }
  .cov { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chev { opacity: .45; margin-left: .35rem; }
  .missing { font-size: .85rem; opacity: .75; margin-top: .2rem; }
  .group-tag { font-size: .75rem; opacity: .6; margin-left: .4rem; }
  @media (hover: hover) { .recipe:hover .name { text-decoration: underline; } }
  /* Above the suggestions deliberately: the cheapest meal is one already cooked,
     so "what's banked" has to be answerable before "what could I make". */
  #freezer { border: 1px solid var(--line); border-radius: var(--radius, 10px);
             background: var(--surface); padding: .7rem .85rem; margin-bottom: 1rem; }
  .freezer-head { font-weight: 600; font-size: .95rem; }
  .freezer-sub { font-size: .8rem; opacity: .7; margin-top: .1rem; }
  .freezer-row { display: flex; justify-content: space-between; gap: 1rem;
                 font-size: .85rem; padding: .3rem 0; align-items: baseline; }
  .freezer-row + .freezer-row { border-top: 1px solid var(--line); }
  .freezer-list { margin-top: .5rem; }
  .freezer-meta { opacity: .7; white-space: nowrap;
                  font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>🥘 Cook Now</h1>

<div id="freezer" hidden></div>
<div id="cook-now-chips"></div>
<p id="hidden-note"></p>
<div id="list">Loading…</div>

<script>
const GROUPS = ["Mains", "Breakfast", "Sides", "Snacks", "Desserts", "Drinks"];
const STORAGE_KEY = "kitchenos.cooknow.groups";

// Desserts starts off: the whole point of the filter is reviewing what to cook
// for a meal. The chip stays visible in its off state so nothing is hidden
// mysteriously.
const DEFAULT_ON = GROUPS.filter(g => g !== "Desserts");

let selected = loadSelection();
let recipes = [];

function loadSelection() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return new Set(DEFAULT_ON);
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return new Set(DEFAULT_ON);
    // An empty stored array means the user deliberately turned every chip off —
    // respect that instead of reviving defaults. But a non-empty array that
    // filters down to nothing means every stored name is stale (e.g. from an
    // older build's group names), so fall back to the defaults in that case.
    if (parsed.length === 0) return new Set();
    const valid = parsed.filter(g => GROUPS.includes(g));
    return new Set(valid.length ? valid : DEFAULT_ON);
  } catch (e) {
    return new Set(DEFAULT_ON);
  }
}

function saveSelection() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...selected]));
  } catch (e) { /* private mode — filtering still works for this session */ }
}

function renderChips() {
  const box = document.getElementById("cook-now-chips");
  box.innerHTML = "";
  for (const group of GROUPS) {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.textContent = group;
    btn.setAttribute("aria-pressed", selected.has(group) ? "true" : "false");
    btn.addEventListener("click", () => {
      if (selected.has(group)) selected.delete(group); else selected.add(group);
      saveSelection();
      renderChips();
      renderList();
    });
    box.appendChild(btn);
  }
}

function renderList() {
  const shown = recipes.filter(r => selected.has(r.group));
  const hidden = recipes.length - shown.length;
  document.getElementById("hidden-note").textContent =
    hidden ? `${hidden} recipe${hidden === 1 ? "" : "s"} hidden by the filter` : "";

  const list = document.getElementById("list");
  if (!shown.length) {
    list.textContent = recipes.length
      ? "Nothing matches the selected chips."
      : "No recipes with ingredients in your library yet.";
    return;
  }
  list.innerHTML = "";
  for (const r of shown) {
    const pct = Math.round(r.coverage * 100);
    // An <a>, so the row opens the recipe — seeing "83%" tells you nothing about
    // whether you want to eat it. encodeURIComponent matters here: real names
    // carry "+", "(", "!" (e.g. "Ham Cheddar + Chive Protein Biscuits").
    const div = document.createElement("a");
    div.className = "recipe";
    div.dataset.group = r.group;
    div.href = "/recipe/" + encodeURIComponent(r.recipe);

    const head = document.createElement("div");
    head.className = "recipe-head";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = r.recipe;
    const tag = document.createElement("span");
    tag.className = "group-tag";
    // Only on a batch that is *known* to freeze. `freezes_well` is null for
    // almost the whole corpus, and labelling a null as freezable is the failure
    // that ends with a thrown-out container weeks later.
    const batch = r.freezes_well === true && r.servings >= 4
      ? ` · ❄️ ${r.servings} servings` : "";
    tag.textContent = r.group + (r.at_risk ? " ⏳" : "") + batch +
      (r.banked ? " · in freezer" : "");
    name.appendChild(tag);
    const cov = document.createElement("span");
    cov.className = "cov";
    cov.textContent = `${pct}% (${r.have}/${r.total})`;
    const chev = document.createElement("span");
    chev.className = "chev";
    chev.setAttribute("aria-hidden", "true");
    chev.textContent = "›";
    cov.appendChild(chev);
    head.append(name, cov);
    div.appendChild(head);

    if (r.missing && r.missing.length) {
      const miss = document.createElement("div");
      miss.className = "missing";
      miss.textContent = "missing: " + r.missing.join(", ");
      div.appendChild(miss);
    }
    list.appendChild(div);
  }
}

// "3 days ago" rather than a date: the only question a frozen container raises
// is how long it's been there.
function frozenWhen(iso) {
  if (!iso) return null;
  const then = new Date(iso + "T00:00:00");
  if (isNaN(then.getTime())) return null;
  const days = Math.round((Date.now() - then.getTime()) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 14) return days + " days ago";
  const weeks = Math.round(days / 7);
  return weeks + " weeks ago";
}

function renderFreezer(data) {
  const box = document.getElementById("freezer");
  const rows = (data && data.freezer) || [];
  // An empty freezer shows nothing at all. A tray reading "0 servings" is a
  // permanent reminder of an absence, which is clutter, not information.
  if (!rows.length) { box.hidden = true; return; }

  const totals = (data && data.totals) || {};
  box.hidden = false;
  box.textContent = "";

  const servings = totals.servings || 0;
  const head = document.createElement("div");
  head.className = "freezer-head";
  head.textContent =
    `🧊 ${servings} serving${servings === 1 ? "" : "s"} already cooked`;
  box.appendChild(head);

  // Only when something priced survived the plausibility gate — otherwise the
  // line would read "0 g protein" for food that simply hasn't been measured.
  if (totals.protein) {
    const sub = document.createElement("div");
    sub.className = "freezer-sub";
    sub.textContent = `${Math.round(totals.protein)} g protein · ` +
                      `${Math.round(totals.calories)} kcal banked`;
    box.appendChild(sub);
  }

  const list = document.createElement("div");
  list.className = "freezer-list";
  for (const r of rows) {
    const row = document.createElement("div");
    row.className = "freezer-row";
    const name = document.createElement("span");
    name.textContent = `${r.recipe} × ${r.servings}`;
    const meta = document.createElement("span");
    meta.className = "freezer-meta";
    const bits = [];
    if (r.protein != null) bits.push(`${r.protein} g each`);
    const when = frozenWhen(r.banked_on);
    if (when) bits.push(when);
    meta.textContent = bits.join(" · ");
    row.append(name, meta);
    list.appendChild(row);
  }
  box.appendChild(list);
}

async function load() {
  let loadError = null;
  // Started before the await below, not after: the tray must not cost the page
  // a second round trip before it can show a suggestion. A freezer failure
  // resolves to null and simply leaves the tray hidden — it must never blank
  // the list, which is the part of the page that still works without it.
  const freezer = fetch("/api/freezer").then(r => r.json()).catch(() => null);
  try {
    const resp = await fetch("/api/cook-now?limit=60");
    const data = await resp.json();
    recipes = data.recipes || [];
  } catch (e) {
    loadError = "Could not load Cook Now.";
  }
  // Chips render unconditionally: a failed fetch must still leave the filter
  // UI usable. Only the recipe list area shows the error in its place.
  renderChips();
  if (loadError) {
    document.getElementById("list").textContent = loadError;
  } else {
    renderList();
  }
  renderFreezer(await freezer);
}

load();
</script>
</body>
</html>
