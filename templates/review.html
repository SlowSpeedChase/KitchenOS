<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory Review</title>
<meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/kitchenos.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 var(--font-body);
         background: var(--bg);
         background-image: var(--dots);
         background-size: var(--dot-size) var(--dot-size);
         color: var(--ink); padding: env(safe-area-inset-top) 0 4rem; }
  header { position: sticky; top: 0; background: var(--surface); padding: 12px 16px;
           display: flex; align-items: center; gap: 12px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  button { font: inherit; border: 1px solid var(--line); border-radius: 10px;
           padding: 8px 12px; background: var(--raised); color: inherit; cursor: pointer; }
  button:active { background: var(--line); }
  #refresh { padding: 8px 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
       border-bottom: 1px solid var(--line-soft); }
  .emoji { font-size: 1.4rem; width: 1.6rem; text-align: center; }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .sub { font-size: 0.8rem; opacity: 0.7; }
  .badge-expired { color: var(--alert); } .badge-soon { color: var(--warning); }
  .actions { display: flex; gap: 6px; align-items: center; }
  .actions button { padding: 8px 10px; }
  .rm { color: var(--alert); border-color: var(--edge-alert); }
  .kebab { font-size: 1.1rem; line-height: 1; padding: 6px 10px; }
  #menu { position: fixed; z-index: 20; min-width: 190px; padding: 4px;
          background: var(--surface); color: var(--ink); border: 1px solid var(--line);
          border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; }
  #menu.show { display: block; }
  #menu .mi { display: flex; align-items: center; gap: 8px; width: 100%;
              text-align: left; border: none; background: none; border-radius: 8px;
              padding: 10px 12px; }
  #menu .mi:active, #menu .mi:hover { background: var(--raised); }
  #menu .mi.danger { color: var(--alert); }
  #menu hr { border: none; border-top: 1px solid var(--line-soft); margin: 4px 6px; }
  #menu .sub-label { font-size: 0.72rem; opacity: 0.55; padding: 6px 12px 2px;
                     text-transform: uppercase; letter-spacing: 0.04em; }
  #menu .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 8px 6px; }
  #menu .chips button { font-size: 0.8rem; padding: 5px 9px; border-radius: 8px; }
  #menu input[type=date] { font: inherit; margin: 2px 8px 6px; padding: 6px;
          border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: inherit; }
  .err { color: var(--alert); font-size: 0.8rem; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           background: rgba(34,34,34,.87); color: rgba(255,255,255,1); padding: 10px 14px; border-radius: 12px;
           display: none; align-items: center; gap: 12px; z-index: 10; }
  #toast.show { display: flex; }
  #toast button { background: rgba(255,255,255,.2); color: rgba(255,255,255,1); border-color: rgba(255,255,255,.33); }
  #empty { padding: 3rem 1rem; text-align: center; opacity: 0.6; }
  li input[type=checkbox], header input[type=checkbox] {
    width: 22px; height: 22px; flex: none; accent-color: var(--app-kitchenos); margin: 0; }
  #bulkbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
             display: flex; align-items: center; gap: 10px;
             padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
             background: var(--surface); border-top: 1px solid var(--line);
             box-shadow: 0 -4px 16px rgba(0,0,0,.2); }
  #bulkbar[hidden] { display: none; }
  #bulkcount { flex: 1; font-weight: 600; }
  #bulkbar .err { flex-basis: 100%; }
  body.has-bulk #toast { bottom: 88px; }
  @keyframes moved { from { background: color-mix(in srgb, var(--app-kitchenos) 33%, transparent); } to { background: transparent; } }
  li.moved { animation: moved 1.4s ease-out; }
  @media (prefers-reduced-motion: reduce) { li.moved { animation: none; } }
  .loc { white-space: nowrap; }
  .loc[title] { border-bottom: 1px dotted currentColor; }
  .used { white-space: nowrap; opacity: .75; }
  .used[title] { border-bottom: 1px dotted currentColor; }
  li.group { display: block; padding: 10px 12px 4px; font-weight: 600;
             opacity: .7; font-size: .85em; text-transform: capitalize;
             border-bottom: none; }
</style>
</head>
<body>
<header>
  <input type="checkbox" id="selall" aria-label="Select all items">
  <h1>Inventory Review</h1>
  <select id="sortby" aria-label="Sort by">
    <option value="expiry">Expiry</option>
    <option value="added">Added</option>
    <option value="location">Location</option>
  </select>
  <button id="refresh" aria-label="Refresh">↻</button>
</header>
<ul id="list"></ul>
<div id="empty" hidden>Nothing in inventory.</div>
<div id="toast"><span id="toast-msg"></span><button id="undo">Undo</button></div>
<div id="menu"></div>
<div id="bulkbar" hidden>
  <button id="bulkclear" aria-label="Clear selection">✕</button>
  <span id="bulkcount"></span>
  <span class="actions">
    <button class="rm" id="bulkrm">Remove</button>
    <button data-bd="3">+3d</button><button data-bd="7">+7d</button>
    <button class="kebab" id="bulkkebab" aria-label="More actions">⋮</button>
  </span>
</div>

<script>
const EMOJI = { produce:"🥬", dairy:"🥛", meat:"🥩", seafood:"🐟", pantry:"🥫",
  frozen:"🧊", bakery:"🍞", beverages:"🧃", household:"🧽", other:"📦" };
const CATEGORIES = ["produce","dairy","meat","seafood","pantry","frozen",
  "bakery","beverages","household","other"];
const LOCATIONS = ["fridge","freezer","pantry","counter","other"];
// Location glyphs, deliberately disjoint from the category EMOJI map above —
// `frozen` already owns 🧊, and a frozen item in the freezer must not render
// the same glyph twice.
const LOC_EMOJI = { fridge:"❄️", freezer:"🥶", pantry:"🫙", counter:"🧺", other:"📍" };
const RANK = { expired:0, soon:1, ok:2 };
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const toast = document.getElementById('toast');
const menu = document.getElementById('menu');
const bulkbar = document.getElementById('bulkbar');
const selall = document.getElementById('selall');
let lastRemoved = null, toastTimer = null;
let menuTarget = null;
const selected = new Set();   // merge keys, so selection survives a re-render
const rows = new Map();       // merge key -> { it, li }

function keyOf(it){
  // Mirrors InventoryItem.merge_key(). The separator below is a NUL *escape*
  // (six characters), not a literal NUL byte — so a name containing the
  // separator can't collide with a different (name, unit, location) triple.
  return [it.name, it.unit, it.location]
    .map(s => (s || "").toLowerCase().trim()).join("\u0000");
}
function refOf(it){
  return { name: it.name, unit: it.unit, location: it.location };
}
function selectedEntries(){
  return [...selected].map(k => rows.get(k)).filter(Boolean);
}

function rankOf(it){
  const r = RANK[it.expiry_status]; return r === undefined ? 3 : r;
}
const LOC_ORDER = {};
LOCATIONS.forEach((l, i) => { LOC_ORDER[l] = i; });
const SORTS = {
  expiry(a, b){
    const dr = rankOf(a) - rankOf(b); if (dr) return dr;
    const ax = a.expires || "9999", bx = b.expires || "9999";
    if (ax !== bx) return ax < bx ? -1 : 1;
    return (a.name||"").localeCompare(b.name||"");
  },
  added(a, b){
    // `purchased` is the date-added stamp. Newest first — the point of this
    // order is "what did I just put away". Rows predating the stamp have no
    // position here, so they sink to the bottom (an empty string loses every
    // `>` comparison) rather than posing as the oldest stock.
    const ax = a.purchased || "", bx = b.purchased || "";
    if (ax !== bx) return ax > bx ? -1 : 1;
    return (a.name||"").localeCompare(b.name||"");
  },
  location(a, b){
    // Vocab order, so the blocks always appear fridge → freezer → pantry →
    // counter → other rather than alphabetically or by whatever arrived first.
    const dl = (LOC_ORDER[a.location] ?? 99) - (LOC_ORDER[b.location] ?? 99);
    if (dl) return dl;
    // Unsure first: the point of this order is to open each block on the rows
    // that actually want a decision.
    const du = (isUnsure(a) ? 0 : 1) - (isUnsure(b) ? 0 : 1);
    if (du) return du;
    return SORTS.expiry(a, b);
  },
};
let sortMode = "expiry";
try { sortMode = localStorage.getItem('reviewSort') || "expiry"; } catch(e){}
if (!SORTS[sortMode]) sortMode = "expiry";
function sortItems(items){
  return items.slice().sort(SORTS[sortMode]);
}
function groupHeader(loc, sorted){
  const li = document.createElement('li');
  li.className = 'group';
  const inBlock = sorted.filter(i => i.location === loc);
  const unsure = inBlock.filter(isUnsure).length;
  li.textContent = `${LOC_EMOJI[loc] || "📍"} ${loc} — ${inBlock.length}`
    + (unsure ? ` · ${unsure} unsure` : "");
  return li;
}
function placeRows(sorted){
  // The single placement path, shared by load() and resort(), so headers can
  // never drift out of sync with the rows they label. Headers are rebuilt from
  // scratch each time: a move changes a row's block, and its counts too.
  for (const h of [...list.querySelectorAll('li.group')]) h.remove();
  let current = null;
  for (const it of sorted){
    if (sortMode === "location" && it.location !== current){
      current = it.location;
      list.appendChild(groupHeader(current, sorted));
    }
    const entry = rows.get(keyOf(it));
    if (entry) list.appendChild(entry.li);
  }
}
function badge(it){
  if (it.expiry_status === "expired") return ` <span class="badge-expired">🔴 expired</span>`;
  if (it.expiry_status === "soon") return ` <span class="badge-soon">🟡 soon</span>`;
  return "";
}
function isUnsure(it){
  // A missing source reads as unsure: fail toward being asked, never toward
  // posing as confirmed.
  return (it.location_source || "default") === "default";
}
function locationLabel(it){
  const loc = it.location || "other";
  const unsure = isUnsure(it);
  const hint = unsure
    ? ' title="Nothing matched — this location is a guess"' : '';
  return `<span class="loc"${hint}>${LOC_EMOJI[loc] || "📍"} ${loc}`
       + `${unsure ? "?" : ""}</span>`;
}
function usedLabel(it){
  // consume-on-cook stamps a row it used but could not safely decrement (a
  // package). Surfacing it is what makes "marked cooked" visible at all for the
  // ~95% of rows that are containers — otherwise the write is invisible.
  if (!it.last_used) return "";
  const days = Math.floor((Date.now() - Date.parse(it.last_used)) / 86400000);
  const when = !Number.isFinite(days) ? "recently"
             : days <= 0 ? "today"
             : days === 1 ? "yesterday"
             : `${days}d ago`;
  const n = it.use_count || 0;
  // The count is a tooltip, not inline: on a shelf you want "did I use this",
  // and the tally only matters when you're wondering why a jar is empty.
  const tally = n > 1 ? ` title="used ${n} times"` : '';
  return `<span class="used"${tally}>· used ${when}</span>`;
}
function subline(it){
  const exp = it.expires ? "exp " + it.expires : "no expiry";
  // Show the date being sorted on, otherwise the "Added" order looks arbitrary.
  const add = sortMode === "added"
    ? " · added " + (it.purchased || "unknown") : "";
  const used = usedLabel(it);
  return locationLabel(it) + " · " + exp + add
       + (used ? " " + used : "") + badge(it);
}
async function load(){
  list.innerHTML = "";
  rows.clear();
  let items;
  try { items = await (await fetch('/api/inventory')).json(); }
  catch(e){ empty.hidden = false; empty.textContent = "Couldn't load inventory. Tap ↻ to retry."; return; }
  empty.hidden = items.length > 0;
  const live = new Set();
  const sorted = sortItems(items);
  for (const it of sorted){
    const key = keyOf(it);
    live.add(key);
    rows.set(key, { it, li: row(it, key) });
  }
  placeRows(sorted);
  // Drop selections whose rows no longer exist.
  for (const k of [...selected]) if (!live.has(k)) selected.delete(k);
  renderBulk();
}
function row(it, key){
  const li = document.createElement('li');
  li.innerHTML =
    `<input type="checkbox" class="pick" aria-label="Select item">` +
    `<span class="emoji">${EMOJI[it.category] || "📦"}</span>` +
    `<span class="meta"><div class="name"></div><div class="sub">${subline(it)}</div></span>` +
    `<span class="actions">` +
    `<button class="rm">Remove</button>` +
    `<button data-d="3">+3d</button><button data-d="7">+7d</button>` +
    `<button class="kebab" aria-label="More actions">⋮</button></span>`;
  li.querySelector('.name').textContent = it.name;
  const pick = li.querySelector('.pick');
  pick.checked = selected.has(key);
  pick.onchange = () => {
    if (pick.checked) selected.add(key); else selected.delete(key);
    renderBulk();
  };
  li.querySelector('.rm').onclick = () => remove(it, li);
  li.querySelectorAll('button[data-d]').forEach(b =>
    b.onclick = () => extend(it, li, parseInt(b.dataset.d, 10)));
  li.querySelector('.kebab').onclick = (e) =>
    openMenu(rowTarget(it, li), e.currentTarget);
  return li;
}
function renderBulk(){
  const n = selected.size;
  bulkbar.hidden = n === 0;
  document.body.classList.toggle('has-bulk', n > 0);
  document.getElementById('bulkcount').textContent =
    n + " selected";
  selall.checked = n > 0 && n === rows.size;
  selall.indeterminate = n > 0 && n < rows.size;
  const e = bulkbar.querySelector('.err'); if (e && n === 0) e.remove();
}
selall.onchange = () => {
  selected.clear();
  if (selall.checked) for (const k of rows.keys()) selected.add(k);
  for (const { li } of rows.values())
    li.querySelector('.pick').checked = selall.checked;
  renderBulk();
};
document.getElementById('bulkclear').onclick = () => {
  selected.clear();
  for (const { li } of rows.values()) li.querySelector('.pick').checked = false;
  renderBulk();
};
function bulkError(msg){
  let e = bulkbar.querySelector('.err');
  if (!e){ e = document.createElement('div'); e.className = 'err';
           bulkbar.appendChild(e); }
  e.textContent = msg;
}
async function runBulk(action, params, errLabel){
  const entries = selectedEntries();
  if (!entries.length) return;
  let body;
  try {
    const r = await fetch('/api/inventory/bulk', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, refs: entries.map(e => refOf(e.it)), ...params }) });
    if (!r.ok){ bulkError(`Couldn't ${errLabel} — tap ↻`); return; }
    body = await r.json();
  } catch(e){ bulkError("Network error — tap ↻"); return; }

  const e = bulkbar.querySelector('.err'); if (e) e.remove();

  if (action === 'remove'){
    lastRemoved = body.removed;
    for (const item of body.removed){
      const entry = rows.get(keyOf(item));
      if (entry){ entry.li.remove(); rows.delete(keyOf(item)); }
    }
    selected.clear();
    showToast(`Removed ${body.removed.length} item${body.removed.length === 1 ? "" : "s"}`);
    renderBulk();
  } else if (action === 'move' || action === 'freeze'){
    // Both change a row's location — and therefore its key — and can merge two
    // rows into one. Patching by the old key would leave the selection stale.
    selected.clear();
    await load();
  } else {
    const touched = [];
    for (const item of body.items){
      const entry = rows.get(keyOf(item));
      if (entry){ applyUpdate(entry.it, entry.li, item); touched.push(entry.li); }
    }
    // Only expiry changes can reorder the list; set-category leaves it alone.
    if (action === 'extend' || action === 'set-expiry'){
      resort();
      for (const li of touched) flash(li);
    }
    renderBulk();
  }
  if (body.not_found && body.not_found.length) await load();
}
document.getElementById('bulkrm').onclick = () => runBulk('remove', {}, "remove");
bulkbar.querySelectorAll('button[data-bd]').forEach(b =>
  b.onclick = () => runBulk('extend', { days: parseInt(b.dataset.bd, 10) }, "extend"));
document.getElementById('bulkkebab').onclick = (e) =>
  openMenu(bulkTarget(), e.currentTarget);
function rowError(li, msg){
  let e = li.querySelector('.err');
  if (!e){ e = document.createElement('div'); e.className = 'err';
           li.querySelector('.meta').appendChild(e); }
  e.textContent = msg;
}
async function remove(it, li){
  try {
    const r = await fetch('/api/inventory/remove', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: it.name, location: it.location }) });
    if (!r.ok){ rowError(li, "Couldn't remove — tap ↻"); return; }
    lastRemoved = [it];
    selected.delete(keyOf(it)); rows.delete(keyOf(it));
    li.remove(); showToast(`Removed ${it.name}`);
    renderBulk();
  } catch(e){ rowError(li, "Network error — tap ↻"); }
}
async function extend(it, li, days){
  try {
    const r = await fetch('/api/inventory/extend', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: it.name, location: it.location, days }) });
    if (!r.ok){ rowError(li, "Couldn't extend — tap ↻"); return; }
    const { item } = await r.json();
    applyUpdate(it, li, item);
    const e = li.querySelector('.err'); if (e) e.remove();
    resort(); flash(li);
  } catch(e){ rowError(li, "Network error — tap ↻"); }
}
async function post(url, body, li, errLabel){
  try {
    const r = await fetch(url, { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body) });
    if (!r.ok){ rowError(li, `Couldn't ${errLabel} — tap ↻`); return null; }
    const { item } = await r.json();
    const e = li.querySelector('.err'); if (e) e.remove();
    return item;
  } catch(e){ rowError(li, "Network error — tap ↻"); return null; }
}
function applyUpdate(it, li, item){
  if (!item) return;
  Object.assign(it, item);
  li.querySelector('.emoji').textContent = EMOJI[it.category] || "📦";
  li.querySelector('.sub').innerHTML = subline(it);
}
function resort(){
  // Re-place rows after an edit moved one between groups — otherwise a row you
  // just rescued stays pinned in the expired block and the tap reads as having
  // done nothing. Moves the existing <li> nodes instead of re-fetching, so
  // checkbox selection and the scroll position survive. Shares placeRows with
  // load(), so group headers can't drift from the rows they label.
  placeRows(sortItems([...rows.values()].map(e => e.it)));
}
function flash(li){
  // Restart the animation even if the row is still mid-flash from a prior tap.
  li.classList.remove('moved');
  void li.offsetWidth;
  li.classList.add('moved');
}
function rowTarget(it, li){
  const SINGLE = { 'set-expiry': '/api/inventory/set-expiry',
                   'set-category': '/api/inventory/set-category',
                   'move': '/api/inventory/move',
                   'freeze': '/api/inventory/freeze' };
  return {
    id: keyOf(it),
    location: it.location, category: it.category, expires: it.expires,
    unsure: isUnsure(it),
    async run(action, params, errLabel){
      const item = await post(SINGLE[action],
        { name: it.name, location: it.location, ...params }, li, errLabel);
      if (!item) return;
      if (action === 'move' || action === 'freeze'){
        // Location is part of the row key, so the row's identity just changed —
        // and in Location order so did its block. Patching in place would leave
        // the rows Map under the stale pre-move key, which is the bug the bulk
        // path already sidesteps by reloading. Take the same path, then flash
        // the row where it landed.
        await load();
        const entry = rows.get(keyOf(item));
        if (entry) flash(entry.li);
        return;
      }
      applyUpdate(it, li, item);
    }
  };
}
function bulkTarget(){
  // A heterogeneous selection has no single current value, so every location
  // and category chip is offered rather than skipping "the current one".
  return {
    id: '__bulk__',
    location: null, category: null, expires: null,
    // A heterogeneous selection has no single provenance, and `location: null`
    // already means no chip is treated as current, so every one is offered.
    unsure: false,
    async run(action, params, errLabel){ await runBulk(action, params, errLabel); }
  };
}
function closeMenu(){
  menu.classList.remove('show'); menuTarget = null;
}
function menuAction(label, fn, cls){
  const b = document.createElement('button');
  b.className = 'mi' + (cls ? ' ' + cls : '');
  b.textContent = label;
  b.onclick = async () => { const t = menuTarget; closeMenu(); await fn(t); };
  return b;
}
function openMenu(target, anchor){
  // Re-tapping the *same* trigger closes; tapping a different one re-opens
  // against the new target. Targets are freshly built each call, so compare
  // their ids, not the objects.
  if (menuTarget && menuTarget.id === target.id &&
      menu.classList.contains('show')){ closeMenu(); return; }
  menuTarget = target;
  menu.innerHTML = '';

  // Set expiration date — native picker
  const dl = document.createElement('div'); dl.className = 'sub-label';
  dl.textContent = 'Expiration'; menu.appendChild(dl);
  const dp = document.createElement('input'); dp.type = 'date';
  if (target.expires) dp.value = target.expires;
  dp.onchange = async () => {
    if (!dp.value) return;
    const t = menuTarget; closeMenu();
    await t.run('set-expiry', { expires: dp.value }, "set date");
  };
  menu.appendChild(dp);
  menu.appendChild(menuAction('🚫 Remove expiration', (t) =>
    t.run('set-expiry', { expires: null }, "clear expiry")));
  menu.appendChild(menuAction('🧊 Mark as frozen', (t) =>
    t.run('freeze', {}, "freeze")));

  menu.appendChild(document.createElement('hr'));

  // Move to…
  const ml = document.createElement('div'); ml.className = 'sub-label';
  ml.textContent = 'Move to'; menu.appendChild(ml);
  const mc = document.createElement('div'); mc.className = 'chips';
  for (const loc of LOCATIONS){
    const isCurrent = loc === target.location;
    // The row's own location is normally skipped — moving somewhere it already
    // is would be a no-op. An *unsure* row is the exception: it needs a way to
    // say "this shelf is right". Without it the guess marker can never be
    // cleared on a correctly-placed row, and the only escape is moving away and
    // back, which teaches a wrong override on the first tap. Confirming posts
    // the same move, which stamps the row manual and teaches the right shelf.
    if (isCurrent && !target.unsure) continue;
    const b = document.createElement('button');
    b.textContent = isCurrent ? `✓ ${loc}` : loc;
    if (isCurrent) b.title = "Confirm this is where it belongs";
    b.onclick = async () => {
      const t = menuTarget; closeMenu();
      await t.run('move', { to_location: loc }, "move");
    };
    mc.appendChild(b);
  }
  menu.appendChild(mc);

  // Category…
  const cl = document.createElement('div'); cl.className = 'sub-label';
  cl.textContent = 'Category'; menu.appendChild(cl);
  const cc = document.createElement('div'); cc.className = 'chips';
  for (const cat of CATEGORIES){
    if (cat === target.category) continue;
    const b = document.createElement('button');
    b.textContent = (EMOJI[cat] || "📦") + " " + cat;
    b.onclick = async () => {
      const t = menuTarget; closeMenu();
      await t.run('set-category', { category: cat }, "set category");
    };
    cc.appendChild(b);
  }
  menu.appendChild(cc);

  // Position anchored to the trigger, clamped to viewport.
  menu.classList.add('show');
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
  left = Math.max(8, left);
  let top = r.bottom + 4;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
}
document.addEventListener('click', (e) => {
  if (menu.classList.contains('show') &&
      !menu.contains(e.target) && !e.target.classList.contains('kebab')) closeMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
window.addEventListener('scroll', closeMenu, true);
function showToast(msg){
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('show'); lastRemoved = null; }, 5000);
}
document.getElementById('undo').onclick = async () => {
  if (!lastRemoved || !lastRemoved.length) return;
  const items = lastRemoved; lastRemoved = null; toast.classList.remove('show');
  await fetch('/api/inventory/add', { method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ items: items.map(it => ({
      name: it.name, quantity: it.quantity, unit: it.unit, category: it.category,
      location: it.location, purchased: it.purchased, expires: it.expires,
      for_recipe: it.for_recipe, source: it.source, notes: it.notes })) }) });
  load();
};
const sortby = document.getElementById('sortby');
sortby.value = sortMode;
sortby.onchange = () => {
  sortMode = SORTS[sortby.value] ? sortby.value : "expiry";
  try { localStorage.setItem('reviewSort', sortMode); } catch(e){}
  // Re-render sublines before re-placing rows: the "added" order shows a date
  // the expiry order does not, so the two modes have different row text.
  for (const { it, li } of rows.values())
    li.querySelector('.sub').innerHTML = subline(it);
  resort();
};
document.getElementById('refresh').onclick = load;
load();
</script>
</body>
</html>
