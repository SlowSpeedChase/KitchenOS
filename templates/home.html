<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitchenOS</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --border: #e5e5e7;
            --text: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0071e3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            max-width: 820px;
            margin: 0 auto;
        }
        header { margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 700; }
        .sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        section { margin-bottom: 24px; }
        h2 {
            font-size: 13px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px;
        }
        .card {
            display: flex; align-items: center; gap: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 10px;
            text-decoration: none;
            color: inherit;
        }
        .card:hover { border-color: var(--accent); }
        .emoji { font-size: 26px; line-height: 1; }
        .text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .title { font-size: 16px; font-weight: 600; }
        .desc { font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>
    <header>
        <h1>KitchenOS</h1>
        <div class="sub">Every page, one tap away.</div>
    </header>
    <!--SECTIONS-->
</body>
</html>
