<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-title" content="KitchenOS">
    <meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
    <title>New recipes · KitchenOS</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/kitchenos.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            background-image: var(--dots);
            background-size: var(--dot-size) var(--dot-size);
            color: var(--ink);
            min-height: 100vh;
            padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
            max-width: 720px;
            margin: 0 auto;
            border-top: 3px solid var(--app-kitchenos);
            -webkit-text-size-adjust: 100%;
        }

        header { margin-bottom: 18px; }
        .kicker {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--app-kitchenos);
            margin-bottom: 6px;
        }
        .kicker a { color: inherit; text-decoration: none; }
        h1 {
            font-family: var(--font-display);
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -.01em;
        }
        .sub { color: var(--muted); font-size: 14px; margin-top: 5px; }

        h2 {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .1em;
            margin: 22px 0 8px;
        }

        .card {
            display: flex; align-items: center; gap: 13px;
            background: var(--surface);
            background-image: var(--grain);
            border: 1px solid var(--line);
            border-radius: var(--radius-box);
            min-height: 62px;
            padding: 13px 15px;
            margin-bottom: 8px;
            text-decoration: none;
            color: inherit;
        }
        .card .text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
        .card .title { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
        .card .desc { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
        .card .chev { font-size: 20px; color: var(--muted); flex: none; }

        .empty { color: var(--muted); font-size: 15px; padding: 20px 2px; }

        @media (hover: hover) {
            .card:hover { border-color: var(--app-kitchenos); }
        }
    </style>
</head>
<body>
    <header>
        <div class="kicker"><a href="/">‹ KitchenOS</a></div>
        <h1>New recipes</h1>
        <div class="sub"><!--SUB--></div>
    </header>

    <!--RECENT-->
</body>
</html>
