<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-title" content="KitchenOS">
    <meta name="theme-color" content="#f4ede3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)">
    <title><!--TITLE--> · KitchenOS</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            background-image: var(--dots);
            background-size: var(--dot-size) var(--dot-size);
            color: var(--ink);
            min-height: 100vh;
            padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
            max-width: 720px;
            margin: 0 auto;
            border-top: 3px solid var(--app-kitchenos);
            -webkit-text-size-adjust: 100%;
            line-height: 1.5;
        }

        header { margin-bottom: 16px; }
        .kicker {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--app-kitchenos);
            margin-bottom: 6px;
        }
        .kicker a { color: inherit; text-decoration: none; }
        h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -.01em;
        }
        .sub { color: var(--muted); font-size: 14px; margin-top: 5px; }

        .note {
            background: var(--surface);
            background-image: var(--grain);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 18px 22px;
            /* Ingredient lines are long; they wrap rather than widening the page. */
            overflow-wrap: anywhere;
        }
        .note h2 {
            font-family: var(--font-display);
            font-size: 20px;
            margin: 22px 0 8px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }
        .note h2:first-child { margin-top: 0; padding-top: 0; border-top: none; }
        .note h3 {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--muted);
            margin: 14px 0 4px;
        }
        .note p { margin: 8px 0; font-size: 15px; }
        .note blockquote {
            border-left: 3px solid var(--line);
            padding-left: 12px;
            margin: 8px 0;
            color: var(--muted);
            font-size: 14px;
        }
        .note ul.tasks { list-style: none; margin: 6px 0; }
        .note ul.tasks li {
            display: flex;
            gap: 10px;
            padding: 7px 0;
            font-size: 15px;
            border-bottom: 1px solid var(--line-soft);
        }
        .note ul.tasks li:last-child { border-bottom: none; }
        .note ul.tasks li.done { color: var(--muted); text-decoration: line-through; }
        .note .box { flex: none; color: var(--muted); }
        .note a.wl { color: var(--app-kitchenos); text-decoration: none; font-weight: 600; }
        .note pre {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--muted);
            white-space: pre-wrap;
        }

        button.gen, a.gen {
            display: inline-block;
            font: inherit;
            font-weight: 600;
            font-size: 15px;
            background: var(--app-kitchenos);
            color: var(--text-on-accent);
            border: none;
            border-radius: var(--radius-box);
            padding: 14px 20px;
            min-height: 48px;
            cursor: pointer;
            margin: 6px 0;
            text-decoration: none;
        }
        button.gen[disabled] { opacity: .55; }

        .empty { color: var(--muted); font-size: 15px; }
        .footer { margin-top: 18px; font-size: 14px; }
        .footer a { color: var(--muted); }
        .msg { font-size: 14px; margin-top: 10px; color: var(--muted); }
        .msg.bad { color: var(--alert); }
    </style>
</head>
<body>
    <header>
        <div class="kicker"><a href="/">‹ KitchenOS</a></div>
        <h1><!--TITLE--></h1>
        <div class="sub"><!--SUB--></div>
    </header>

    <div class="note"><!--BODY--></div>

    <div class="footer"><!--OBSIDIAN--></div>

    <script>
    // The one button that matters: generating a shopping list over plain HTTP.
    // The vault note's own button uses a kitchenos:// scheme handled by a macOS
    // helper app, so it has never worked from a phone.
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('button.gen');
        if (!btn) return;
        const week = btn.dataset.week;
        btn.disabled = true;
        const label = btn.textContent;
        btn.textContent = 'Generating…';
        const msg = document.createElement('div');
        msg.className = 'msg';
        btn.after(msg);
        try {
            const r = await fetch('/generate-shopping-list', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({week})
            });
            const d = await r.json();
            if (!r.ok || d.success === false) throw new Error(d.error || 'failed');
            msg.textContent = `${d.item_count} items — reloading…`;
            location.reload();
        } catch (err) {
            msg.className = 'msg bad';
            msg.textContent = `Could not generate: ${err.message}`;
            btn.disabled = false;
            btn.textContent = label;
        }
    });
    </script>
</body>
</html>
