[pytest]
# End-to-end browser tests are deselected by default: they need a live server
# and a downloaded Chromium, and they are ~100x slower than the unit suite.
# `.venv/bin/pytest -q` must keep reporting the unit-suite count alone.
#
# Run them explicitly:  .venv/bin/pytest tests/e2e -m e2e -v
addopts = -m "not e2e"
markers =
    e2e: end-to-end browser test; needs a live server (see requirements-e2e.txt)
    corpus: audits the real vault's data (no server, no browser); skips if the
        vault is absent. Deliberately NOT excluded by addopts — a drift guard
        that only runs when someone remembers to ask for it is documentation,
        not enforcement.
